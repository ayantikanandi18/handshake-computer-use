[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cua"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.40", "pydantic>=2.7", "flask>=3.0", "pyyaml>=6.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
